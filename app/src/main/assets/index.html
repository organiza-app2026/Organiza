<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090f23">
<title>Organiza</title>
<style>
:root{--bg:#090f23;--panel:#121d3b;--panel2:#18274b;--blue:#6c8cff;--cyan:#64d8ff;--text:#f5f7ff;--muted:#aab7d8;--line:#2b3b65}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#203c78 0,#101a38 36%,var(--bg) 75%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:24px 18px 12px;max-width:850px;margin:auto} .brand{font-size:28px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--cyan)}.sub{color:var(--muted);margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;padding:8px 14px 14px;max-width:900px;margin:auto}nav button{white-space:nowrap;border:1px solid var(--line);background:#101a34;color:var(--muted);padding:10px 13px;border-radius:13px;font-weight:700}nav button.active{background:linear-gradient(135deg,var(--blue),#5570d8);color:white;border-color:transparent}
main{max-width:850px;margin:auto;padding:0 14px 34px}.hero,.card{background:linear-gradient(145deg,rgba(28,44,83,.96),rgba(15,25,51,.97));border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:13px;box-shadow:0 12px 28px #0002}.hero h1{font-size:26px;line-height:1.12;margin:7px 0 9px}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid #3c568d;border-radius:999px;padding:5px 9px;font-size:12px;color:#c7d5ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stat{background:#0d1730;border:1px solid var(--line);padding:15px;border-radius:17px}.stat b{font-size:24px;display:block}.section-title{font-size:20px;margin:4px 0 12px}.field{width:100%;border:1px solid #344775;background:#0b1530;color:var(--text);border-radius:12px;padding:12px;font:inherit;margin:5px 0 10px}textarea.field{min-height:85px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:750;background:linear-gradient(135deg,var(--blue),#536fdb);color:white;cursor:pointer}.btn.secondary{background:#17264b;border:1px solid #344775}.btn.danger{background:#572c4a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task .name{flex:1;overflow-wrap:anywhere}.task.done .name{text-decoration:line-through;color:#8c9abc}.small{font-size:13px;color:var(--muted)}.stars button{font-size:31px;background:none;border:0;color:#627194;padding:3px;cursor:pointer}.stars button.on{color:#ffd166}.hidden{display:none!important}.notice{font-size:13px;color:#ffdfa0;background:#45361e;border:1px solid #6b552c;border-radius:12px;padding:11px;margin-top:10px}footer{text-align:center;color:#8291b7;font-size:12px;padding:18px}
@media(min-width:700px){header{padding-top:32px}.hero{padding:27px}.hero h1{font-size:34px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand">Organ<span>iza</span> ✦</div><div class="sub">Tes idées, tes tâches, ton organisation.</div></header>
<nav id="nav"></nav><main id="app"></main><footer>Organiza · Prototype 1.0 · Données conservées sur cet appareil</footer>
<script>
const tabs=[['home','Accueil'],['tasks','Fiches'],['planning','Planning'],['alarm','Réveil'],['profile','Profil'],['settings','Paramètres'],['premium','Premium']];
let page='home',tasks=JSON.parse(localStorage.getItem('org_tasks')||'[]'),rating=Number(localStorage.getItem('org_rating')||0),alarm=localStorage.getItem('org_alarm')||'07:00',sound=localStorage.getItem('org_sound')||'Douce',username=localStorage.getItem('org_name')||'';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('org_tasks',JSON.stringify(tasks));render()}
function premiumUnlocked(){return rating===5}
function nav(){ $('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('') }
function go(p){page=p;render()}
function taskMarkup(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="name"><b>${esc(t.title)}</b><div class="small">${esc(t.when||'Sans horaire')}</div></div><button class="btn secondary" onclick="deleteTask('${t.id}')">Supprimer</button></div>`}
function render(){nav();let open=tasks.filter(t=>!t.done).length,done=tasks.filter(t=>t.done).length;let out='';
if(page==='home')out=`<section class="hero"><span class="pill">TON ESPACE PERSONNEL</span><h1>Une journée plus simple commence ici.</h1><p class="muted">Note tes tâches, organise tes idées et avance à ton rythme.</p><div class="row"><button class="btn" onclick="go('tasks')">＋ Ajouter une fiche</button><button class="btn secondary" onclick="go('planning')">Voir mon planning</button></div></section><div class="grid"><div class="stat"><span class="muted">À faire</span><b>${open}</b><span class="small">tâche(s) restante(s)</span></div><div class="stat"><span class="muted">Terminées</span><b>${done}</b><span class="small">bien joué !</span></div><div class="stat"><span class="muted">Premium</span><b>${premiumUnlocked()?'Actif':'Verrouillé'}</b><span class="small">${premiumUnlocked()?'Planificateur disponible':'Note 5 étoiles requise dans la démo'}</span></div></div><section class="card" style="margin-top:13px"><h2 class="section-title">À ne pas oublier</h2>${tasks.filter(t=>!t.done).slice(0,4).map(taskMarkup).join('')||'<p class="muted">Aucune tâche pour le moment. Ajoute ta première fiche !</p>'}</section>`;
if(page==='tasks')out=`<section class="card"><h2 class="section-title">Mes fiches</h2><label>Titre de la tâche</label><input id="taskTitle" class="field" placeholder="Ex. Réviser la physique"><label>Horaire (facultatif)</label><input id="taskWhen" class="field" placeholder="Ex. 17:30"><button class="btn" onclick="addTask()">Ajouter la fiche</button><div style="margin-top:15px">${tasks.map(taskMarkup).join('')||'<p class="muted">Tes fiches apparaîtront ici.</p>'}</div></section>`;
if(page==='planning')out=`<section class="card"><h2 class="section-title">Mon planning</h2><p class="muted">Tes tâches avec horaire, triées dans l'ordre.</p>${[...tasks].sort((a,b)=>(a.when||'99:99').localeCompare(b.when||'99:99')).map(taskMarkup).join('')||'<p class="muted">Ajoute des tâches avec un horaire dans Fiches.</p>'}</section>${premiumUnlocked()?`<section class="card"><h2 class="section-title">Planificateur Premium ✦</h2><p class="muted">Écris plusieurs activités séparées par des virgules, points-virgules ou retours à la ligne.</p><textarea id="plannerInput" class="field" placeholder="Devoirs, réviser les maths, ranger ma chambre"></textarea><button class="btn" onclick="makePlan()">Organiser mes activités</button><div id="planResult"></div><p class="small">Planificateur local de démonstration ; il ne se connecte pas à une IA en ligne.</p></section>`:`<section class="card"><h2 class="section-title">Planificateur Premium ✦</h2><p class="muted">Cette fonction est verrouillée. Dans cette démo, la note de 5 étoiles l'active.</p><button class="btn" onclick="go('premium')">Voir Premium</button></section>`}`;
if(page==='alarm')out=`<section class="card"><h2 class="section-title">Mon réveil</h2><p class="muted">Choisis une heure et un son préféré.</p><label>Heure du réveil</label><input class="field" type="time" id="alarmTime" value="${esc(alarm)}"><label>Sonnerie</label><select class="field" id="alarmSound">${['Douce','Classique','Énergique','Bip'].map(s=>`<option ${s===sound?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="saveAlarm()">Enregistrer</button><p id="alarmMsg" class="small">Réveil enregistré : ${esc(alarm)} · ${esc(sound)}</p><div class="notice">Limite : cette version enregistre le réglage, mais ne peut pas garantir une sonnerie si l'application est fermée. Utilise aussi l'alarme du téléphone.</div></section>`;
if(page==='profile')out=`<section class="card"><h2 class="section-title">Mon profil</h2><label>Comment veux-tu être appelé(e) ?</label><input class="field" id="nameInput" value="${esc(username)}" placeholder="Mon prénom"><button class="btn" onclick="saveProfile()">Enregistrer le profil</button><p class="muted">Tes informations restent enregistrées sur cet appareil dans cette version.</p></section>`;
if(page==='settings')out=`<section class="card"><h2 class="section-title">Paramètres</h2><p class="muted">Gère tes données locales.</p><div class="row"><button class="btn secondary" onclick="exportData()">Exporter mes données (JSON)</button><button class="btn danger" onclick="resetApp()">Réinitialiser l'application</button></div><p class="small">La réinitialisation efface les tâches, le profil et la note enregistrée sur cet appareil.</p></section>`;
if(page==='premium')out=`<section class="hero"><span class="pill">ORGANIZA PREMIUM</span><h1>Ton organisation, en mieux.</h1><h2>4,50 € / mois</h2><p class="muted">Planificateur d'activités en démonstration et outils d'organisation.</p><div class="notice">La version actuelle ne traite aucun paiement. Le tarif est affiché à titre indicatif.</div></section><section class="card"><h2 class="section-title">Évalue Organiza</h2><p class="muted">Dans cette version de démonstration, sélectionner 5 étoiles déverrouille le planificateur Premium. Ce n'est pas un paiement.</p><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n} étoile(s)" class="${rating>=n?'on':''}" onclick="setRating(${n})">★</button>`).join('')}</div><p>${rating?`Ta note : ${rating}/5`:'Choisis une note'}</p><p class="small">${premiumUnlocked()?'Planificateur Premium déverrouillé dans cette démo.':'Le planificateur reste verrouillé tant que la note n’est pas de 5 étoiles.'}</p><button class="btn ${premiumUnlocked()?'':'secondary'}" onclick="go('planning')">${premiumUnlocked()?'Ouvrir le planificateur':'Retour au planning'}</button></section>`;
$('#app').innerHTML=out}
function addTask(){let title=$('#taskTitle').value.trim(),when=$('#taskWhen').value.trim();if(!title){alert('Écris un titre pour ta fiche.');return}tasks.push({id:Date.now().toString(),title,when,done:false});save()}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save()}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save()}
function saveAlarm(){alarm=$('#alarmTime').value||'07:00';sound=$('#alarmSound').value;localStorage.setItem('org_alarm',alarm);localStorage.setItem('org_sound',sound);render()}
function saveProfile(){username=$('#nameInput').value.trim();localStorage.setItem('org_name',username);alert('Profil enregistré.');render()}
function setRating(n){rating=n;localStorage.setItem('org_rating',String(n));render()}
function makePlan(){let items=$('#plannerInput').value.split(/[,;\\n]+/).map(s=>s.trim()).filter(Boolean);let el=$('#planResult');if(!items.length){el.innerHTML='<p class="muted">Ajoute au moins une activité.</p>';return}let mins=items.length?Math.floor(120/items.length):0;el.innerHTML='<h3>Proposition de planning</h3>'+items.map((x,i)=>`<div class="task"><span class="pill">${String(16+Math.floor((i*mins)/60)).padStart(2,'0')}:${String((i*mins)%60).padStart(2,'0')}</span><div class="name">${esc(x)}</div><span class="small">≈ ${mins} min</span></div>`).join('')+'<p class="small">Planning estimé automatiquement, à ajuster selon tes besoins.</p>'}
function exportData(){let blob=new Blob([JSON.stringify({tasks,rating,alarm,sound,username},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='organiza-donnees.json';a.click();URL.revokeObjectURL(a.href)}
function resetApp(){if(confirm('Effacer toutes les données Organiza sur cet appareil ?')){['org_tasks','org_rating','org_alarm','org_sound','org_name'].forEach(k=>localStorage.removeItem(k));tasks=[];rating=0;alarm='07:00';sound='Douce';username='';page='home';render()}}
render();
</script></body></html>
